{{ define "title" }}
  {{ .Site.Title }}
{{ end }}

{{ define "content" }}
  <section class="container list">
    <header>
      <h1 class="title">
        <a class="title-link" href="{{ .Permalink | safeURL }}">
          {{ .Site.Title }}
        </a>
      </h1>
    </header>
    <ul>
      {{- $posts := (where .Site.RegularPages "Type" "posts").ByDate.Reverse -}}
      {{- range (.Paginate $posts).Pages -}}
        {{- .Render "li" -}}
      {{- end -}}
    </ul>

    {{ partial "pagination.html" . }}
  </section>
{{ end }}
