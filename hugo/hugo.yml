baseURL: 'https://lloydlore.github.io/'
locale: 'en'
defaultContentLanguage: 'en'
title: 'A Byte of Cybersecurity'
theme: 'hugo-coder'
enableEmoji: true

pagination:
  pagerSize: 8

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: false
    hl_lines: ""
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: true
    noClasses: false
    style: "monokai"
    tabWidth: 4

params:
  author: "丛朝"
  description: "A little bit of here, a little bit of there"
  keywords: "blog,cybersecurity,personal"
  info:
    - "Love <--> Peace"
  avatarURL: ""
  dateFormat: "January 2, 2006"
  colorScheme: "auto"
  hideColorSchemeToggle: false
  commit: "https://github.com/LloydLore/LloydLore.github.io/tree/"
  maxSeeAlsoItems: 5
  customCSS: []
  customSCSS: []
  customJS: []
  customRemoteJS: []

menu:
  main:
    - identifier: "about"
      name: "About"
      url: "/about/"
      weight: 5
    - identifier: "posts"
      name: "Posts"
      url: "/posts/"
      weight: 10
    - identifier: "categories"
      name: "Categories"
      url: "/categories/"
      weight: 20
    - identifier: "tags"
      name: "Tags"
      url: "/tags/"
      weight: 30

taxonomies:
  category: "categories"
  tag: "tags"
  author: "authors"
